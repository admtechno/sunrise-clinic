# Module 9, Session 15: nginx serves the built Clinic Desk and passes /api on to
# the API container, so the page and the API share one origin (as with the Vite
# proxy in Session 01): no CORS, and the refresh cookie works as before.
server {
    listen 80;
    root /usr/share/nginx/html;

    # the files in /assets have a hash in their name: they may be kept for ever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;            # a missing file is a 404, not the page
    }

    # the API, by its name in docker-compose.yml
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;   # with the port: links in answers stay right
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # every other address belongs to the page's router: send index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
