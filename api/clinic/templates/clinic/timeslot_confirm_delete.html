{% extends "base.html" %}

{% block title %}Delete slot{% endblock %}

{% block content %}
  <h1>Delete this slot?</h1>
  <p>{{ object }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'clinic:slot_list' %}">Cancel</a>
  </form>
{% endblock %}
