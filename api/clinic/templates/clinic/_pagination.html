{% if is_paginated %}
  <p class="pages">
    {% if page_obj.has_previous %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">&larr; Previous</a>{% endif %}
    Page {{ page_obj.number }} of {{ paginator.num_pages }} ({{ paginator.count }} in total)
    {% if page_obj.has_next %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next &rarr;</a>{% endif %}
  </p>
{% endif %}
